<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07050d; font-family: system-ui, sans-serif; color: #ffe9c4; }
    canvas { display: block; }
    #hud { position: fixed; top: 12px; left: 12px; display: flex; gap: 10px; flex-wrap: wrap; pointer-events: none; }
    .pill { background: rgba(20, 12, 30, .72); border: 1px solid rgba(255, 190, 110, .35); border-radius: 10px; padding: 6px 12px; font-size: 15px; }
    .pill b { color: #ffc46b; }
    #hint { position: fixed; bottom: 18%; width: 100%; text-align: center; font-size: 18px; color: #ffd38a; text-shadow: 0 0 8px #000; pointer-events: none; }
    #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(7, 5, 13, .72); }
    #overlay .card { max-width: 460px; margin: 16px; padding: 24px 28px; background: rgba(28, 18, 40, .95); border: 1px solid #ffb35c66; border-radius: 14px; text-align: center; }
    #overlay h1 { margin: 0 0 8px; color: #ffbe5c; }
    #overlay table { margin: 12px auto; text-align: left; font-size: 14px; border-spacing: 10px 4px; }
    kbd { background: #3a2a4d; border-radius: 4px; padding: 1px 6px; font-family: inherit; }
    #flash { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle, rgba(255,200,110,.45), transparent 60%); opacity: 0; transition: opacity .25s; }
    #hurt { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px rgba(120, 30, 160, .9); opacity: 0; transition: opacity .3s; }
  </style>
  <script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
  <div id="hud"></div>
  <div id="hint"></div>
  <div id="flash"></div>
  <div id="hurt"></div>
  <div id="overlay"><div class="card" id="card"></div></div>
  <script type="module" src="/web/main.js"></script>
</body>
</html>
