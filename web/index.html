<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    :root {
      --night: #0E1430; --mist: #1B2350; --gold: #F2C14E; --danger: #FF5A5F; --ui: #F5F1E6;
      --lit: #FFB347; --core: #FFE9B0; --off: #5B5F6E; --red: #C8102E; --drift: #8FA3B8;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); font-family: system-ui, "Segoe UI", sans-serif; color: var(--ui); user-select: none; }
    canvas { display: block; }
    .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 4px #000; }
    #flames { top: 14px; left: 16px; font-size: 26px; letter-spacing: 4px; }
    #flames .off { opacity: .25; filter: grayscale(1); }
    #timer { top: 10px; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
    #timer.danger { color: var(--danger); animation: blink .8s steps(2) infinite; }
    body.cb { --danger: #FFFFFF; }
    #topright b.short { color: var(--danger); }
    body.cb #topright b.short::before { content: "⚠ "; }
    #bar { align-items: center; }
    #bar b { margin-left: 8px; font-size: 16px; color: var(--gold); }
    @keyframes blink { 50% { opacity: .35; } }
    #topright { top: 12px; right: 16px; text-align: right; font-size: 18px; line-height: 1.5; }
    #topright b { color: var(--gold); font-size: 22px; }
    #bar { bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; }
    #bar i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #FFE58A55; background: #0E143099; }
    #bar i.on { background: radial-gradient(circle, #FFF6C2 30%, #FFE58A 70%); box-shadow: 0 0 10px #FFE58A; border-color: #FFE58A; }
    #cds { bottom: 18px; right: 18px; display: flex; gap: 12px; }
    .cd { width: 66px; height: 66px; border-radius: 50%; position: relative; background: conic-gradient(var(--gold) calc(var(--p) * 1turn), #0E1430cc 0); display: grid; place-items: center; }
    .cd span { position: absolute; inset: 4px; border-radius: 50%; background: #0E1430e6; display: grid; place-items: center; font-size: 11px; text-align: center; line-height: 1.1; }
    .cd.ready span { color: var(--gold); }
    #prompt { bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 20px; background: #0E1430cc; border: 1px solid var(--gold); border-radius: 8px; padding: 6px 14px; display: none; }
    #charm { top: 52px; left: 16px; font-size: 15px; color: var(--red); display: none; }
    #windwarn { top: 56px; left: 50%; transform: translateX(-50%); font-size: 16px; color: var(--drift); display: none; }
    #arrow { width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 30px solid var(--lit); filter: drop-shadow(0 0 6px var(--lit)); display: none; }
    body.nohud .hud { display: none !important; }
    #fps { bottom: 4px; left: 6px; font-size: 12px; opacity: .6; }
    #flash { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle, #FFE9B088, transparent 60%); opacity: 0; transition: opacity .25s; }
    #hurt { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 140px #7A3CFFdd; opacity: 0; transition: opacity .3s; }
    #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #0E1430b3; }
    .card { max-width: 520px; margin: 16px; padding: 26px 30px; background: #1B2350f2; border: 1px solid #F2C14E66; border-radius: 16px; text-align: center; box-shadow: 0 10px 40px #000a; }
    .card h1 { margin: 0 0 6px; color: var(--gold); font-size: 34px; }
    .card h2 { margin: 0 0 12px; color: var(--lit); font-weight: 500; }
    .card p { line-height: 1.5; }
    .quote { font-style: italic; color: var(--core); border-left: 3px solid var(--lit); padding-left: 12px; text-align: left; }
    .card table { margin: 10px auto; text-align: left; font-size: 14px; border-spacing: 10px 3px; }
    kbd { background: #0E1430; border: 1px solid #F2C14E55; border-radius: 4px; padding: 1px 6px; font-family: inherit; }
    .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    button { font: inherit; font-size: 17px; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--gold); background: #0E1430; color: var(--ui); cursor: pointer; }
    button:hover, button:focus { background: var(--gold); color: var(--night); outline: none; }
    label { display: grid; grid-template-columns: 1fr 1.4fr 3em; gap: 10px; align-items: center; margin: 10px 0; text-align: left; }
    .score { font-size: 26px; color: var(--gold); }
  </style>
  <script>addEventListener('error', (e) => { document.title = 'ERR ' + e.message; });</script>
  <script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
  <div id="flames" class="hud"></div>
  <div id="charm" class="hud">🧧 Bùa Gió</div>
  <div id="timer" class="hud"></div>
  <div id="windwarn" class="hud">🍃 Gió sắp nổi…</div>
  <div id="topright" class="hud"></div>
  <div id="bar" class="hud"></div>
  <div id="cds" class="hud">
    <div class="cd" id="cdDash"><span>Lướt<br><kbd>Shift</kbd></span></div>
    <div class="cd" id="cdPulse"><span>Tỏa sáng<br><kbd>F</kbd></span></div>
  </div>
  <div id="prompt" class="hud"></div>
  <div id="arrow" class="hud"></div>
  <div id="fps" class="hud"></div>
  <div id="flash"></div>
  <div id="hurt"></div>
  <div id="overlay"><div class="card" id="card"></div></div>
  <script type="module" src="/web/main.js"></script>
</body>
</html>
