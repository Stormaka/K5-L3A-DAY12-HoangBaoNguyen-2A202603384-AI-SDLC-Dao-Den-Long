<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    :root {
      --night: #0E1430; --mist: #1B2350; --gold: #F2C14E; --danger: #FF5A5F; --ui: #F5F1E6;
      --lit: #FFB347; --core: #FFE9B0; --off: #5B5F6E; --red: #C8102E; --drift: #8FA3B8; --shade: #7A3CFF;
    }
    /* Ticket-04: every UI text >= 18 px at 1280x720 (1rem = 18px); "Chữ lớn" scales it x1.25 */
    html { font-size: 18px; }
    html.large { font-size: 22.5px; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); font-family: system-ui, "Segoe UI", sans-serif; color: var(--ui); user-select: none; }
    canvas { display: block; }
    .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 4px #000; font-size: 1rem; }
    #flames { top: 14px; left: 16px; font-size: 1.45rem; letter-spacing: 4px; }
    #flames .off { opacity: .25; filter: grayscale(1); }
    #timer { top: 10px; left: 50%; transform: translateX(-50%); font-size: 1.65rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    #timer.danger { color: var(--danger); animation: blink .8s steps(2) infinite; }
    body.cb { --danger: #FFFFFF; --shade: #00B3FF; }
    #topright b.short { color: var(--danger); }
    body.cb #topright b.short::before { content: "⚠ "; }
    @keyframes blink { 50% { opacity: .35; } }
    #topright { top: 12px; right: 16px; text-align: right; line-height: 1.5; }
    #topright b { color: var(--gold); font-size: 1.2rem; }
    #topright small { font-size: 1rem; }
    #bar { bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; align-items: center; }
    #bar i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #FFE58A55; background: #0E143099; }
    #bar i.on { background: radial-gradient(circle, #FFF6C2 30%, #FFE58A 70%); box-shadow: 0 0 10px #FFE58A; border-color: #FFE58A; }
    #bar b { margin-left: 8px; color: var(--gold); }
    #cds { bottom: 14px; right: 14px; display: flex; gap: 10px; }
    .cd { width: 5rem; height: 5rem; border-radius: 50%; position: relative; background: conic-gradient(var(--gold) calc(var(--p) * 1turn), #0E1430cc 0); display: grid; place-items: center; }
    .cd span { position: absolute; inset: 4px; border-radius: 50%; background: #0E1430e6; display: grid; place-items: center; font-size: 1rem; text-align: center; line-height: 1.05; }
    .cd.ready span { color: var(--gold); }
    #prompt { bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 1.1rem; background: #0E1430cc; border: 1px solid var(--gold); border-radius: 8px; padding: 6px 14px; display: none; }
    #charm { top: 3.2rem; left: 16px; color: var(--red); display: none; }
    #windwarn { top: 3.4rem; left: 50%; transform: translateX(-50%); color: var(--drift); display: none; }
    #captions { left: 16px; bottom: 110px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    #captions div { background: #0E1430e0; border-left: 4px solid var(--gold); padding: 4px 12px; border-radius: 6px; }
    #captions div.warn { border-color: var(--danger); }
    #captions div.shade { border-color: var(--shade); }
    .arrow { width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 30px solid var(--lit); filter: drop-shadow(0 0 6px var(--lit)); display: none; }
    .arrow.shade { border-bottom-color: var(--shade); filter: drop-shadow(0 0 6px var(--shade)); }
    body.nohud .hud { display: none !important; }
    #fps { bottom: 4px; left: 6px; opacity: .6; }
    #flash { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle, #FFE9B088, transparent 60%); opacity: 0; transition: opacity .25s; }
    #hurt { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 140px #7A3CFFdd; opacity: 0; transition: opacity .3s; }
    body.reduce #flash, body.reduce #hurt { display: none; }
    #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #0E1430b3; }
    .card { max-width: 600px; max-height: 92vh; overflow-y: auto; margin: 16px; padding: 22px 28px; background: #1B2350f2; border: 1px solid #F2C14E66; border-radius: 16px; text-align: center; box-shadow: 0 10px 40px #000a; font-size: 1rem; }
    .card h1 { margin: 0 0 6px; color: var(--gold); font-size: 1.9rem; }
    .card h2 { margin: 0 0 10px; color: var(--lit); font-weight: 500; font-size: 1.3rem; }
    .card p { line-height: 1.45; margin: .5em 0; }
    .quote { font-style: italic; color: var(--core); border-left: 3px solid var(--lit); padding-left: 12px; text-align: left; }
    .card table { margin: 8px auto; text-align: left; font-size: 1rem; border-spacing: 10px 3px; }
    kbd { background: #0E1430; border: 1px solid #F2C14E55; border-radius: 4px; padding: 0 6px; font-family: inherit; font-size: 1rem; }
    .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    button, input { font: inherit; font-size: 1rem; }
    button { padding: 8px 16px; border-radius: 9px; border: 1px solid var(--gold); background: #0E1430; color: var(--ui); cursor: pointer; }
    button:hover, button:focus { background: var(--gold); color: var(--night); outline: none; }
    label { display: grid; grid-template-columns: 1fr 1.3fr 3.2em; gap: 10px; align-items: center; margin: 8px 0; text-align: left; }
    input[type=text] { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--gold); background: #0E1430; color: var(--ui); width: 12em; }
    .err { color: var(--danger); }
    body.cb .err::before { content: "⚠ "; }
    .score { font-size: 1.45rem; color: var(--gold); }
    table.board { border-collapse: collapse; width: 100%; }
    table.board td, table.board th { padding: 3px 8px; border-bottom: 1px solid #F2C14E33; }
    table.board tr.me { background: #F2C14E33; }
    table.keys td:last-child { text-align: right; }
    table.keys button { min-width: 8em; padding: 4px 10px; }
    table.keys tr.dup button { border-color: var(--danger); color: var(--danger); }
    body.cb table.keys tr.dup button::before { content: "⚠ "; }
  </style>
  <script>addEventListener('error', (e) => { document.title = 'ERR ' + e.message; });</script>
  <script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
  <div id="flames" class="hud"></div>
  <div id="charm" class="hud">🧧 Bùa Gió</div>
  <div id="timer" class="hud"></div>
  <div id="windwarn" class="hud">🍃 Gió sắp nổi…</div>
  <div id="topright" class="hud"></div>
  <div id="bar" class="hud"></div>
  <div id="cds" class="hud">
    <div class="cd" id="cdDash"><span>Lướt<br><kbd id="kDash">Shift</kbd></span></div>
    <div class="cd" id="cdPulse"><span>Tỏa sáng<br><kbd id="kPulse">F</kbd></span></div>
  </div>
  <div id="prompt" class="hud"></div>
  <div id="captions" class="hud" aria-live="polite"></div>
  <div id="arrow" class="hud arrow"></div>
  <div id="shadeArrows" class="hud"></div>
  <div id="fps" class="hud"></div>
  <div id="flash"></div>
  <div id="hurt"></div>
  <div id="overlay"><div class="card" id="card"></div></div>
  <script type="module" src="/web/main.js"></script>
</body>
</html>
